
name: Build The Forgotten World

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Unpack project
        run: unzip -o the-forgotten-world-0.1-cloud-build.zip

      - name: Build mod
        run: gradle -p the-forgotten-world build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: The-Forgotten-World-1.21.11
          path: the-forgotten-world/build/libs/the-forgotten-world-0.1.0.jar
          if-no-files-found: error
          
